<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build the Robot</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef4f8;
  text-align:center;
  color:#243b53;
}
header{
  background:#274c77;
  color:white;
  padding:16px;
}
header h1{margin:0 0 6px;}
#step{font-size:20px;font-weight:bold;}

.game{
  max-width:850px;
  margin:20px auto;
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 5px 18px #0002;
}

.robot-area{
  height:300px;
  position:relative;
  margin:auto;
  width:300px;
}

/* ROBOT HEAD */
.head{
  position:absolute;
  width:180px;
  height:100px;
  left:60px;
  top:10px;
  background:#82c4e8;
  border:5px solid #243b53;
  border-radius:30px;
}

/* SENSOR EYES */
.sensor{
  display:none;
  position:absolute;
  top:35px;
  width:32px;
  height:32px;
  background:#ffd166;
  border:5px solid #243b53;
  border-radius:50%;
}
.eye1{left:32px;}
.eye2{right:32px;}

/* BODY */
.body{
  position:absolute;
  width:160px;
  height:120px;
  left:70px;
  top:120px;
  background:#9bd3ae;
  border:5px solid #243b53;
  border-radius:25px;
}

/* CONTROLLER */
.controller{
  display:none;
  position:absolute;
  width:90px;
  height:55px;
  left:30px;
  top:28px;
  background:#ff8fab;
  border:4px solid #243b53;
  border-radius:10px;
  font-weight:bold;
  line-height:55px;
}

/* MOTORS / WHEELS */
.motor{
  display:none;
  position:absolute;
  width:55px;
  height:55px;
  top:235px;
  background:#777;
  border:5px solid #243b53;
  border-radius:50%;
}
.motor1{left:65px;}
.motor2{right:65px;}

.question{
  font-size:24px;
  font-weight:bold;
  margin:10px;
}

.answers{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

button{
  padding:16px;
  width:200px;
  border:3px solid #274c77;
  background:white;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#e6f2ff;}

#feedback{
  font-size:21px;
  font-weight:bold;
  min-height:35px;
  margin-top:15px;
}

.complete{
  color:#198754;
  font-size:27px;
}
</style>
</head>

<body>

<header>
<h1>🤖 Build the Robot</h1>
<div>SENSE → PROCESS → ACT</div>
<div id="step">Step 1 of 3</div>
</header>

<div class="game">

<div class="robot-area">

  <div class="head">
    <div id="sensor1" class="sensor eye1"></div>
    <div id="sensor2" class="sensor eye2"></div>
  </div>

  <div class="body">
    <div id="controller" class="controller">CONTROL</div>
  </div>

  <div id="motor1" class="motor motor1"></div>
  <div id="motor2" class="motor motor2"></div>

</div>

<div id="question" class="question">
The robot needs to detect an obstacle.<br>
Which part should we add?
</div>

<div id="answers" class="answers">
<button onclick="choose('sensor')">👀 SENSOR<br>SENSE</button>
<button onclick="choose('controller')">🧠 CONTROLLER<br>PROCESS</button>
<button onclick="choose('motor')">⚙️ MOTOR<br>ACT</button>
</div>

<div id="feedback">Choose a robot part.</div>

</div>

<script>
let stage=1;

function choose(part){

let feedback=document.getElementById("feedback");
let question=document.getElementById("question");
let step=document.getElementById("step");

if(stage===1){

 if(part==="sensor"){
   document.getElementById("sensor1").style.display="block";
   document.getElementById("sensor2").style.display="block";

   feedback.innerHTML="✅ Correct! SENSOR = SENSE 👀";

   setTimeout(()=>{
     stage=2;
     step.innerHTML="Step 2 of 3";
     question.innerHTML=
     "The robot sensed the obstacle.<br>Which part decides what to do?";
     feedback.innerHTML="Choose the next robot part.";
   },900);

 }else{
   feedback.innerHTML="❌ Try again. The robot needs to SENSE.";
 }
}

else if(stage===2){

 if(part==="controller"){
   document.getElementById("controller").style.display="block";

   feedback.innerHTML="✅ Correct! CONTROLLER = PROCESS 🧠";

   setTimeout(()=>{
     stage=3;
     step.innerHTML="Step 3 of 3";
     question.innerHTML=
     "The robot decided to move.<br>Which part makes it move?";
     feedback.innerHTML="Choose the final robot part.";
   },900);

 }else{
   feedback.innerHTML="❌ Try again. Which part makes the decision?";
 }
}

else if(stage===3){

 if(part==="motor"){

   document.getElementById("motor1").style.display="block";
   document.getElementById("motor2").style.display="block";

   step.innerHTML="ROBOT COMPLETE! 🎉";

   question.innerHTML="🎉 Great job! You built the robot!";

   feedback.innerHTML=
   '<div class="complete">👀 SENSE → 🧠 PROCESS → ⚙️ ACT</div>';

   document.getElementById("answers").innerHTML=
   '<button onclick="location.reload()">🔄 BUILD AGAIN</button>';

 }else{
   feedback.innerHTML="❌ Try again. Which part makes the robot MOVE?";
 }
}

}
</script>

</body>
</html>
